<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0d14">
  <meta name="description" content="StudyFlow — track assignments, exams, and study sessions">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>StudyFlow</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,700;1,9..144,400&family=DM+Sans:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ========== SIDEBAR ========== -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="logo">
        <svg class="logo-mark" width="26" height="26" viewBox="0 0 26 26" fill="none">
          <rect width="26" height="26" rx="7" fill="var(--accent)"/>
          <path d="M7 13h5m0 0V8m0 5v5m4-9h3M16 16h3" stroke="#0b0d14" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span class="logo-text">StudyFlow</span>
      </div>
      <button class="icon-btn sidebar-close" id="sidebarClose" aria-label="Close menu">&#x2715;</button>
    </div>

    <nav class="nav" role="navigation" aria-label="Main">
      <button class="nav-item active" data-view="dashboard" aria-current="page">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="2" y="2" width="6" height="6" rx="1.5"/><rect x="10" y="2" width="6" height="6" rx="1.5"/><rect x="2" y="10" width="6" height="6" rx="1.5"/><rect x="10" y="10" width="6" height="6" rx="1.5"/></svg>
        <span>Dashboard</span>
      </button>
      <button class="nav-item" data-view="assignments">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="3" y="2" width="12" height="14" rx="2"/><path d="M6 6h6M6 9h6M6 12h4"/></svg>
        <span>Assignments</span>
        <span class="nav-badge" id="navBadgeAssign" style="display:none"></span>
      </button>
      <button class="nav-item" data-view="exams">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="2" y="3" width="14" height="13" rx="2"/><path d="M2 7h14M6 1v4M12 1v4"/></svg>
        <span>Exams</span>
        <span class="nav-badge" id="navBadgeExam" style="display:none"></span>
      </button>
      <button class="nav-item" data-view="study">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="9" cy="9" r="7"/><path d="M9 5v4l3 2"/></svg>
        <span>Study Timer</span>
      </button>
    </nav>

    <div class="sidebar-footer">
      <div class="streak-pill">
        <span class="streak-flame">🔥</span>
        <span><strong id="streakCount">0</strong> day streak</span>
      </div>
      <button class="settings-btn" id="settingsBtn" aria-label="Settings">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="8" r="2.5"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.05 3.05l1.41 1.41M11.54 11.54l1.41 1.41M3.05 12.95l1.41-1.41M11.54 4.46l1.41-1.41"/></svg>
      </button>
    </div>
  </aside>

  <!-- Mobile overlay -->
  <div class="overlay" id="overlay" role="presentation"></div>

  <!-- ========== MAIN ========== -->
  <main class="main">

    <!-- Top bar -->
    <header class="topbar" role="banner">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 5h14M3 10h14M3 15h14"/></svg>
      </button>
      <span class="topbar-title" id="topbarTitle" aria-live="polite">Dashboard</span>
      <div class="topbar-actions">
        <button class="btn-primary hidden" id="addBtn" aria-label="Add item">+ Add</button>
      </div>
    </header>

    <!-- ===== VIEWS ===== -->
    <div class="content">

      <!-- DASHBOARD -->
      <section class="view active" id="view-dashboard" aria-label="Dashboard">
        <div class="view-header">
          <h1 class="view-title">Good <span id="timeOfDay">morning</span>,<br><em id="userName">Student</em>.</h1>
          <p class="view-subtitle" id="dashSubtitle">Here's your day at a glance.</p>
        </div>
        <div class="stats-grid" id="statsGrid" role="region" aria-label="Stats"></div>
        <div class="dash-two-col">
          <div>
            <h2 class="section-label">Due Soon</h2>
            <div id="dueSoonList" role="list"></div>
          </div>
          <div>
            <h2 class="section-label">Upcoming Exams</h2>
            <div id="upcomingExams" role="list"></div>
          </div>
        </div>
        <div class="dash-bottom">
          <h2 class="section-label">Recent Study</h2>
          <div id="recentStudy" role="list"></div>
        </div>
      </section>

      <!-- ASSIGNMENTS -->
      <section class="view" id="view-assignments" aria-label="Assignments">
        <div class="view-header">
          <h1 class="view-title">Assignments</h1>
          <div class="filter-row" role="group" aria-label="Filter assignments">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="pending">Pending</button>
            <button class="filter-btn" data-filter="completed">Done</button>
          </div>
        </div>
        <div id="assignmentsList" role="list"></div>
      </section>

      <!-- EXAMS -->
      <section class="view" id="view-exams" aria-label="Exams">
        <div class="view-header">
          <h1 class="view-title">Exams</h1>
        </div>
        <div id="examsList" role="list"></div>
      </section>

      <!-- STUDY TIMER -->
      <section class="view" id="view-study" aria-label="Study Timer">
        <div class="view-header">
          <h1 class="view-title">Study Timer</h1>
        </div>

        <div class="timer-card" role="timer" aria-live="off">
          <div class="timer-course-row">
            <label class="form-label" for="timerCourse">Studying for</label>
            <input type="text" id="timerCourse" class="input" placeholder="Course or subject…" autocomplete="off" list="timerCourseList">
            <datalist id="timerCourseList"></datalist>
          </div>

          <div class="timer-display-wrap">
            <div class="timer-ring" id="timerRing">
              <svg viewBox="0 0 120 120" width="180" height="180" aria-hidden="true">
                <circle cx="60" cy="60" r="54" fill="none" stroke="var(--border)" stroke-width="6"/>
                <circle id="timerProgress" cx="60" cy="60" r="54" fill="none" stroke="var(--accent)" stroke-width="6"
                  stroke-linecap="round" stroke-dasharray="339.3" stroke-dashoffset="339.3"
                  transform="rotate(-90 60 60)" style="transition: stroke-dashoffset 0.25s linear;"/>
              </svg>
              <div class="timer-display" id="timerDisplay" aria-live="polite" aria-atomic="true">00:00:00</div>
            </div>
          </div>

          <div class="timer-controls">
            <button class="btn-timer start" id="timerStart">Start</button>
            <button class="btn-timer pause hidden" id="timerPause">Pause</button>
            <button class="btn-timer stop hidden" id="timerStop">Save &amp; Stop</button>
          </div>

          <div class="timer-presets" role="group" aria-label="Quick presets">
            <span class="preset-label">Preset:</span>
            <button class="preset-btn" data-mins="25">25 min</button>
            <button class="preset-btn" data-mins="45">45 min</button>
            <button class="preset-btn" data-mins="60">1 hr</button>
            <button class="preset-btn" data-mins="90">90 min</button>
          </div>
        </div>

        <div class="study-log-header">
          <h2 class="section-label">Study Log</h2>
          <span class="study-total" id="studyTotal"></span>
        </div>
        <div id="studyLog" role="list"></div>
      </section>

    </div><!-- /content -->
  </main>

  <!-- ========== MODALS ========== -->
  <div class="modal-backdrop hidden" id="modalBackdrop" role="dialog" aria-modal="true" aria-label="Form">

    <!-- Add Assignment -->
    <div class="modal hidden" id="modal-assignment">
      <div class="modal-header">
        <h2 class="modal-title">New Assignment</h2>
        <button class="icon-btn modal-close" data-modal="assignment" aria-label="Close">&#x2715;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label" for="aTitle">Title <span aria-hidden="true">*</span></label>
          <input type="text" id="aTitle" class="input" placeholder="e.g. Lab Report #3" autocomplete="off">
        </div>
        <div class="form-group">
          <label class="form-label" for="aCourse">Course</label>
          <input type="text" id="aCourse" class="input" placeholder="e.g. BIOL 201" autocomplete="off" list="courseList">
          <datalist id="courseList"></datalist>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="aDueDate">Due Date <span aria-hidden="true">*</span></label>
            <input type="date" id="aDueDate" class="input">
          </div>
          <div class="form-group">
            <label class="form-label" for="aPriority">Priority</label>
            <select id="aPriority" class="input">
              <option value="high">High</option>
              <option value="medium" selected>Medium</option>
              <option value="low">Low</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="aNotes">Notes</label>
          <textarea id="aNotes" class="input textarea" placeholder="Chapter references, rubric notes…" rows="3"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-ghost" data-modal="assignment">Cancel</button>
        <button class="btn-primary" id="saveAssignment">Save Assignment</button>
      </div>
    </div>

    <!-- Add Exam -->
    <div class="modal hidden" id="modal-exam">
      <div class="modal-header">
        <h2 class="modal-title">New Exam</h2>
        <button class="icon-btn modal-close" data-modal="exam" aria-label="Close">&#x2715;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label" for="eTitle">Exam Name <span aria-hidden="true">*</span></label>
          <input type="text" id="eTitle" class="input" placeholder="e.g. Midterm Exam" autocomplete="off">
        </div>
        <div class="form-group">
          <label class="form-label" for="eCourse">Course</label>
          <input type="text" id="eCourse" class="input" placeholder="e.g. MATH 241" autocomplete="off">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="eDate">Date &amp; Time <span aria-hidden="true">*</span></label>
            <input type="datetime-local" id="eDate" class="input">
          </div>
          <div class="form-group">
            <label class="form-label" for="eLocation">Location</label>
            <input type="text" id="eLocation" class="input" placeholder="Room or building" autocomplete="off">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="eNotes">Notes</label>
          <textarea id="eNotes" class="input textarea" placeholder="Topics covered, materials allowed…" rows="3"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-ghost" data-modal="exam">Cancel</button>
        <button class="btn-primary" id="saveExam">Save Exam</button>
      </div>
    </div>

    <!-- Settings -->
    <div class="modal hidden" id="modal-settings">
      <div class="modal-header">
        <h2 class="modal-title">Settings</h2>
        <button class="icon-btn modal-close" data-modal="settings" aria-label="Close">&#x2715;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label" for="settingName">Your Name</label>
          <input type="text" id="settingName" class="input" placeholder="What should we call you?">
        </div>
        <div class="danger-zone">
          <p class="danger-label">Danger Zone</p>
          <button class="btn-danger" id="clearDataBtn">Clear All Data</button>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-ghost" data-modal="settings">Cancel</button>
        <button class="btn-primary" id="saveSettings">Save</button>
      </div>
    </div>

  </div>

  <!-- Toast container -->
  <div class="toast-container" id="toastContainer" aria-live="polite" aria-atomic="false"></div>

  <script src="script.js"></script>
</body>
</html>
