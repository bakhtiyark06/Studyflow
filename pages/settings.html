<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0d14">
  <title>StudyFlow | Settings</title>
  <link rel="manifest" href="../manifest.json">
  <link rel="stylesheet" href="../style.css">
</head>
<body data-page="settings">
  <div id="appShell"></div>
  <template id="pageContent">
    <section class="page-title-row">
      <div>
        <p class="eyebrow">Preferences</p>
        <h1>Settings</h1>
      </div>
      <button class="btn primary" id="saveSettings">Save</button>
    </section>
    <section class="settings-grid">
      <article class="panel form-panel">
        <label class="label" for="studentName">Your name</label>
        <input class="input" id="studentName" placeholder="Student">
        <label class="checkbox-row">
          <input type="checkbox" id="compactMode">
          <span>Use compact lists</span>
        </label>
      </article>
      <article class="panel form-panel">
        <div class="panel-header">
          <h2>Reminder Settings</h2>
          <a class="text-link" href="notifications.html">Notification center</a>
        </div>
        <label class="checkbox-row">
          <input type="checkbox" id="notificationsEnabled">
          <span>Enable browser notifications</span>
        </label>
        <label class="label" for="defaultAssignmentReminder">Default assignment reminder</label>
        <select class="input" id="defaultAssignmentReminder">
          <option value="day-of">Day of deadline</option>
          <option value="1d">1 day before</option>
          <option value="2d">2 days before</option>
          <option value="1w">1 week before</option>
          <option value="none">No reminder</option>
        </select>
        <label class="label" for="defaultAssignmentReminderTime">Default assignment reminder time</label>
        <input class="input" id="defaultAssignmentReminderTime" type="time">
        <label class="label" for="defaultExamReminder">Default exam reminder</label>
        <select class="input" id="defaultExamReminder">
          <option value="day-of">Day of exam</option>
          <option value="1d">1 day before</option>
          <option value="2d">2 days before</option>
          <option value="1w">1 week before</option>
          <option value="none">No reminder</option>
        </select>
        <label class="label" for="defaultExamReminderTime">Default exam reminder time</label>
        <input class="input" id="defaultExamReminderTime" type="time">
        <label class="checkbox-row">
          <input type="checkbox" id="dailyFocusReminder">
          <span>Daily focus reminder</span>
        </label>
        <label class="label" for="dailyFocusTime">Daily focus time</label>
        <input class="input" id="dailyFocusTime" type="time">
        <label class="checkbox-row">
          <input type="checkbox" id="quietHoursEnabled">
          <span>Use quiet hours</span>
        </label>
        <div class="form-grid two-col">
          <div>
            <label class="label" for="quietStart">Quiet start</label>
            <input class="input" id="quietStart" type="time">
          </div>
          <div>
            <label class="label" for="quietEnd">Quiet end</label>
            <input class="input" id="quietEnd" type="time">
          </div>
        </div>
        <p class="muted-note">If browser notifications are denied, StudyFlow still shows in-app alerts.</p>
      </article>
      <article class="panel danger-zone">
        <h2>Data</h2>
        <p>Clear local app data from this browser. This does not affect GitHub files.</p>
        <button class="btn danger" id="clearData">Clear StudyFlow Data</button>
      </article>
    </section>
  </template>
  <div id="toastRegion" class="toast-region" aria-live="polite"></div>
  <script type="module" src="../assets/js/pages/settings.js"></script>
</body>
</html>
