<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0d14">
  <title>StudyFlow | Login</title>
  <link rel="manifest" href="../manifest.json">
  <link rel="stylesheet" href="../style.css">
</head>
<body data-page="login">
  <div id="appShell"></div>
  <template id="pageContent">
    <section class="page-title-row">
      <div>
        <p class="eyebrow">Account</p>
        <h1>Login</h1>
      </div>
      <span class="pill" id="authMode">Local Mode</span>
    </section>

    <section class="auth-layout">
      <article class="panel auth-form">
        <div class="panel-header">
          <h2>Student Account</h2>
        </div>
        <label class="label" for="authEmail">Email</label>
        <input class="input" id="authEmail" type="email" autocomplete="email" placeholder="student@example.com">
        <label class="label" for="authPassword">Password</label>
        <input class="input" id="authPassword" type="password" autocomplete="current-password" placeholder="At least 6 characters">
        <div class="button-row">
          <button class="btn primary" id="loginBtn">Log In</button>
          <button class="btn" id="signupBtn">Sign Up</button>
          <button class="btn danger" id="logoutBtn">Log Out</button>
        </div>
        <p class="muted-note" id="authMessage">Firebase is not configured yet. Your data stays in localStorage.</p>
      </article>

      <article class="panel">
        <div class="panel-header">
          <h2>Sync Plan</h2>
        </div>
        <div class="status-list" id="syncKeys"></div>
        <div class="button-row">
          <button class="btn" id="previewPayloadBtn">Preview Local Data</button>
          <button class="btn" id="cloudSyncBtn">Cloud Sync Coming Soon</button>
        </div>
      </article>
    </section>
  </template>
  <div id="toastRegion" class="toast-region" aria-live="polite"></div>
  <script type="module" src="../assets/js/pages/login.js"></script>
</body>
</html>
