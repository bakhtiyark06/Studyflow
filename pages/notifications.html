<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0d14">
  <title>StudyFlow | Notifications</title>
  <link rel="manifest" href="../manifest.json">
  <link rel="stylesheet" href="../style.css">
</head>
<body data-page="notifications">
  <div id="appShell"></div>
  <template id="pageContent">
    <section class="page-title-row">
      <div>
        <p class="eyebrow">Student success</p>
        <h1>Notifications</h1>
        <p class="muted-note">Smart reminders for deadlines, exams, study rhythm, and daily focus.</p>
      </div>
      <button class="btn primary" id="enableNotifications">Enable Browser Notifications</button>
    </section>

    <section class="settings-grid">
      <article class="panel">
        <div class="panel-header">
          <h2>Notification Status</h2>
          <span class="pill" id="notificationStatus">Checking</span>
        </div>
        <p class="dashboard-callout" id="notificationSummary">StudyFlow will use in-app alerts if browser notifications are unavailable.</p>
      </article>

      <article class="panel">
        <div class="panel-header">
          <h2>Recommended Focus</h2>
          <a class="text-link" href="timer.html">Timer</a>
        </div>
        <p class="dashboard-callout" id="focusRecommendation">Your focus recommendation will appear here.</p>
      </article>
    </section>

    <section class="notification-center-grid">
      <article class="panel">
        <div class="panel-header">
          <h2>Due Soon</h2>
          <a class="text-link" href="assignments.html">Assignments</a>
        </div>
        <div id="dueSoonAlerts" class="stack-list"></div>
      </article>

      <article class="panel">
        <div class="panel-header">
          <h2>Overdue</h2>
          <a class="text-link" href="assignments.html">Fix now</a>
        </div>
        <div id="overdueAlerts" class="stack-list"></div>
      </article>

      <article class="panel">
        <div class="panel-header">
          <h2>Exams Soon</h2>
          <a class="text-link" href="exams.html">Plan</a>
        </div>
        <div id="examAlerts" class="stack-list"></div>
      </article>

      <article class="panel">
        <div class="panel-header">
          <h2>Completed Reminders</h2>
          <button class="btn" id="clearCompletedReminders">Clear</button>
        </div>
        <div id="completedReminders" class="stack-list"></div>
      </article>
    </section>
  </template>
  <div id="toastRegion" class="toast-region" aria-live="polite"></div>
  <script type="module" src="../assets/js/pages/notifications.js"></script>
</body>
</html>
