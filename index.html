<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0d14">
  <meta name="description" content="StudyFlow - track assignments, exams, study sessions, and notes.">
  <title>StudyFlow | Dashboard</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="dashboard">
  <div id="appShell"></div>

  <template id="pageContent">
    <section class="page-hero">
      <div>
        <p class="eyebrow">Today</p>
        <h1>Good <span id="timeOfDay">morning</span>, <em id="userName">Student</em>.</h1>
        <p id="dashboardSubtitle">A focused command center for classes, deadlines, exams, and study time.</p>
      </div>
      <div class="hero-meter">
        <span id="focusScore">0%</span>
        <small>weekly focus</small>
      </div>
    </section>

    <section class="stats-grid" id="statsGrid" aria-label="StudyFlow stats"></section>

    <section class="dashboard-grid">
      <article class="panel span-2">
        <div class="panel-header">
          <h2>Priority Assignments</h2>
          <a class="text-link" href="pages/assignments.html">View all</a>
        </div>
        <div id="dueSoonList" class="stack-list"></div>
      </article>

      <article class="panel">
        <div class="panel-header">
          <h2>Upcoming Exams</h2>
          <a class="text-link" href="pages/exams.html">Plan</a>
        </div>
        <div id="upcomingExams" class="stack-list"></div>
      </article>

      <article class="panel">
        <div class="panel-header">
          <h2>Study Statistics</h2>
          <a class="text-link" href="pages/stats.html">Details</a>
        </div>
        <div id="studyStatsMini" class="mini-chart"></div>
      </article>

      <article class="panel">
        <div class="panel-header">
          <h2>Recent Study</h2>
          <a class="text-link" href="pages/timer.html">Timer</a>
        </div>
        <div id="recentStudy" class="stack-list"></div>
      </article>
    </section>
  </template>

  <div id="toastRegion" class="toast-region" aria-live="polite"></div>
  <script type="module" src="assets/js/pages/dashboard.js"></script>
</body>
</html>
